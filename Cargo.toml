[package]
name = "boilerplate"
version = "1.3.0"
description = "Minimal compile-time Rust template engine"
authors.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
exclude = [
  "/.gitattributes",
  "/.github",
  "/bin",
  "/justfile",
  "/rustfmt.toml",
  "/vim",
]

[dependencies]
boilerplate-macros = { version = "0.0.5", path = "crates/boilerplate-macros" }
boilerplate-parser = { version = "0.0.2", path = "crates/boilerplate-parser", optional = true }

[dev-dependencies]
axum = "0.8.7"

[features]
axum = ["boilerplate-macros/axum"]
reload = [
  "boilerplate-macros/reload",
  "boilerplate-parser/reload",
  "dep:boilerplate-parser",
]

[lints]
workspace = true

[workspace]
members = [".", "crates/*"]

[workspace.dependencies]
pretty_assertions = "1.0.0"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow"
pedantic = { level = "deny", priority = -1 }
too_many_lines = "allow"
wildcard_imports = "allow"

[workspace.lints.rust]
mismatched_lifetime_syntaxes = "allow"

[workspace.package]
authors = ["Casey Rodarmor <casey@rodarmor.com>"]
categories = ["template-engine", "no-std"]
edition = "2024"
license = "CC0-1.0"
repository = "https://github.com/casey/boilerplate"
