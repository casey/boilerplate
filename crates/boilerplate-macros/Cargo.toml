[package]
name = "boilerplate-macros"
version = "0.0.4"
description = "Minimal compile-time Rust template engine macros"
authors.workspace = true
categories.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
boilerplate-parser = { version = "0.0.1", path = "../boilerplate-parser" }
darling = "0.24.0"
mime = "0.3.17"
new_mime_guess = "4.0.1"
proc-macro2 = "1.0.63"
quote = "1.0.29"
syn = { version = "3.0.0", features = ["derive"] }

[dev-dependencies]
pretty_assertions.workspace = true

[features]
axum = []
reload = ["boilerplate-parser/reload"]

[lints]
workspace = true
